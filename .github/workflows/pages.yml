name: pages

# Publishes the landing page (site/) to GitHub Pages. The page references the
# README's screenshots and brand assets, which are copied in at build time so
# they live in one place in the repo. Requires Settings → Pages → Source:
# "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R docs/screenshots _site/screenshots
          cp -R docs/brand _site/brand
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
